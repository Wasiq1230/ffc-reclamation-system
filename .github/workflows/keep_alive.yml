name: 24/7 Backend Keep-Alive

on:
  schedule:
    # Run every 10 minutes (UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Pinging FFC Reclamation Backend on Render..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" https://ffc-reclamation-api.onrender.com/api/health)
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
            echo "✓ Backend is healthy and awake!"
          else
            echo "⚠ Warning: Backend responded with non-200 code."
          fi
