version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ffc_valve_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ffc_valves
      POSTGRES_USER: ffc_admin
      POSTGRES_PASSWORD: ffc_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffc_admin -d ffc_valves"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ffc_valve_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ffc_admin:ffc_secure_password_2026@db:5432/ffc_valves
      SECRET_KEY: ffc_production_secret_key_super_secure_2026
      STORAGE_DIR: /app/storage
    volumes:
      - app_storage:/app/storage
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ffc_valve_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  app_storage:
